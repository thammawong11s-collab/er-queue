<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเรียกคิวห้องฉุกเฉิน โรงพยาบาลบางแพ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Sarabun',sans-serif;background:#0f172a;color:#e2e8f0;overflow-x:hidden}
    .hidden{display:none!important}
    #connectionStatus{position:fixed;top:10px;right:10px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;z-index:999;background:#dc2626;color:#fff}
    #connectionStatus.connected{background:#16a34a}
    .board{padding:20px;min-height:100vh;display:flex;flex-direction:column;gap:16px}
    .top{display:flex;justify-content:space-between;align-items:center}
    .hospital-title{color:#38bdf8;font-weight:600;font-size:22px;display:block;margin-bottom:2px}
    h1{font-size:30px}
    #clock{font-size:30px;font-weight:800}
    
    /* ส่วนแสดงผลคิวปัจจุบัน */
    #nowCalling{border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;background:#1e293b;border:3px solid #334155;min-height:180px;justify-content:center}
    #nowCalling.flash{animation:flash .8s 4}
    @keyframes flash{50%{background:#475569;border-color:#facc15}}
    
    .calling-main{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .q-box{font-size:56px;font-weight:800;padding:2px 20px;background:#0f172a;border-radius:12px;border:1px solid #475569;color:#38bdf8}
    .patient-info{display:flex;flex-direction:column;gap:4px}
    .hn-text{font-size:22px;color:#94a3b8;font-weight:600}
    .name-text{font-size:36px;font-weight:800;color:#fff}
    
    .badge-container{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap}
    .lvl-badge{font-size:20px;font-weight:700;padding:4px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.2)}
    .status-badge{font-size:20px;font-weight:700;padding:4px 14px;border-radius:999px;background:#0284c7;color:#fff}

    .nav-link{color:#38bdf8;cursor:pointer;text-decoration:underline;font-size:16px;display:inline-block}

    /* ฟอร์มเจ้าหน้าที่ */
    .staff-container{background:#1e293b;padding:24px;border-radius:12px;margin-top:10px;max-width:650px;border:1px solid #334155}
    .staff-container label{display:block;margin-bottom:6px;font-weight:600;color:#94a3b8}
    .staff-container input, .staff-container select{width:100%;padding:12px;margin-bottom:16px;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:8px;font-family:'Sarabun';font-size:16px}
    .btn-group{display:flex;gap:10px}
    .staff-container button{flex:1;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-family:'Sarabun';font-size:16px}
    .staff-container button:hover{background:#1d4ed8}
    .btn-danger{background:#dc2626!important}
    .btn-danger:hover{background:#b91c1c!important}
  </style>
</head>
<body>

  <div id="connectionStatus">กำลังเชื่อมต่อ...</div>

  <!-- หน้าจอแสดงผลคิว (Public View) -->
  <div id="publicView" class="board">
    <div class="top">
      <div>
        <span class="hospital-title">โรงพยาบาลบางแพ</span>
        <h1>ห้องฉุกเฉิน — ลำดับการรับบริการ</h1>
      </div>
      <div id="clock">--:--:--</div>
    </div>

    <a class="nav-link" onclick="switchView('staff')">[ ไปหน้าเจ้าหน้าที่กรอกข้อมูล ]</a>

    <div id="nowCalling">
      <div style="font-size:28px;font-weight:600;color:#94a3b8;">รอเรียกคิวรับบริการ...</div>
    </div>
  </div>

  <!-- หน้าจอเจ้าหน้าที่ (Staff View) -->
  <div id="staffView" class="board hidden">
    <div class="top">
      <div>
        <span class="hospital-title">โรงพยาบาลบางแพ</span>
        <h1>ระบบบันทึกและเรียกคิว (เจ้าหน้าที่ ER)</h1>
      </div>
    </div>
    <a class="nav-link" onclick="switchView('public')">[ กลับไปหน้าจอแสดงคิว ]</a>

    <div class="staff-container">
      <label>หมายเลขคิว</label>
      <input type="text" id="queueNumberInput" placeholder="เช่น A001 หรือ 01">

      <label>เลข HN</label>
      <input type="text" id="hnInput" placeholder="เช่น 67-001234">

      <label>ชื่อ - สกุล ผู้ป่วย (เซนเซอร์นามสกุล เช่น สมชาย ใจดี***)</label>
      <input type="text" id="nameInput" placeholder="เช่น นายสมชาย ใจดี***">

      <label>ระดับความฉุกเฉิน</label>
      <select id="queueLevelInput">
        <option value="ฉุกเฉินวิกฤต (Resuscitation)">ฉุกเฉินวิกฤต (Resuscitation)</option>
        <option value="ฉุกเฉินรุนแรง (Emergency)">ฉุกเฉินรุนแรง (Emergency)</option>
        <option value="ฉุกเฉินด่วน (Urgent)">ฉุกเฉินด่วน (Urgent)</option>
        <option value="ไม่ฉุกเฉิน (Non-Urgent)">ไม่ฉุกเฉิน (Non-Urgent)</option>
      </select>

      <label>สถานะการรักษา</label>
      <select id="statusInput">
        <option value="รอพบแพทย์">รอพบแพทย์</option>
        <option value="กำลังตรวจรักษา / ทำแผล">กำลังตรวจรักษา / ทำแผล</option>
        <option value="นอนพักสังเกตอาการ">นอนพักสังเกตอาการ</option>
        <option value="ส่งต่อโรงพยาบาลอื่น">ส่งต่อโรงพยาบาลอื่น</option>
        <option value="จำหน่ายกลับบ้าน">จำหน่ายกลับบ้าน</option>
      </select>

      <div class="btn-group">
        <button onclick="callQueueSubmit()">ประกาศเรียกคิว</button>
        <button onclick="clearQueueSubmit()" class="btn-danger">เคลียร์หน้าจอ</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const connStatus = document.getElementById('connectionStatus');

    socket.on('connect', () => {
      connStatus.textContent = 'เชื่อมต่อแล้ว';
      connStatus.classList.add('connected');
    });

    socket.on('disconnect', () => {
      connStatus.textContent = 'ขาดการเชื่อมต่อ';
      connStatus.classList.remove('connected');
    });

    function switchView(view) {
      const publicView = document.getElementById('publicView');
      const staffView = document.getElementById('staffView');
      if (view === 'staff') {
        publicView.classList.add('hidden');
        staffView.classList.remove('hidden');
      } else {
        staffView.classList.add('hidden');
        publicView.classList.remove('hidden');
      }
    }

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('th-TH');
    }, 1000);

    // รับข้อมูลคิวและแสดงผล
    socket.on('updateQueue', (data) => {
      const callingDiv = document.getElementById('nowCalling');
      if (data.currentCalling) {
        const c = data.currentCalling;
        
        // กำหนดสีป้ายระดับความฉุกเฉิน
        let badgeColor = '#334155';
        if (c.level.includes('วิกฤต')) badgeColor = '#991b1b';
        else if (c.level.includes('รุนแรง')) badgeColor = '#c2410c';
        else if (c.level.includes('ด่วน')) badgeColor = '#854d0e';
        else badgeColor = '#166534';

        callingDiv.innerHTML = `
          <div class="calling-main">
            <div class="q-box">${c.number}</div>
            <div class="patient-info">
              <div class="hn-text">HN: ${c.hn}</div>
              <div class="name-text">${c.name}</div>
            </div>
          </div>
          <div class="badge-container">
            <div class="lvl-badge" style="background:${badgeColor}">${c.level}</div>
            <div class="status-badge">สถานะ: ${c.status}</div>
          </div>
        `;
        callingDiv.classList.add('flash');
        setTimeout(() => callingDiv.classList.remove('flash'), 3200);
      } else {
        callingDiv.innerHTML = `<div style="font-size:28px;font-weight:600;color:#94a3b8;">รอเรียกคิวรับบริการ...</div>`;
      }
    });

    function callQueueSubmit() {
      const number = document.getElementById('queueNumberInput').value.trim();
      const hn = document.getElementById('hnInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();
      const level = document.getElementById('queueLevelInput').value;
      const status = document.getElementById('statusInput').value;

      if (!number || !hn || !name) {
        alert('กรุณากรอกข้อมูล หมายเลขคิว, เลข HN และชื่อ-สกุล ให้ครบถ้วน');
        return;
      }

      socket.emit('callQueue', { number, hn, name, level, status });
      
      // ล้างช่องกรอกหมายเลขคิวและ HN เพื่อความสะดวกรวดเร็วในการกรอกเคสถัดไป
      document.getElementById('queueNumberInput').value = '';
      document.getElementById('hnInput').value = '';
      document.getElementById('nameInput').value = '';
      
      alert('ส่งข้อมูลเรียกคิวสำเร็จ!');
    }

    function clearQueueSubmit() {
      socket.emit('clearQueue');
    }
  </script>
</body>
</html>
