<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเรียกคิวห้องฉุกเฉิน โรงพยาบาลบางบัวทอง</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Sarabun',sans-serif;background:#0f172a;color:#e2e8f0;overflow-x:hidden}
    .hidden{display:none!important}
    #connectionStatus{position:fixed;top:10px;right:10px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;z-index:999;background:#dc2626;color:#fff}
    #connectionStatus.connected{background:#16a34a}
    .board{padding:16px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
    .top{display:flex;justify-content:space-between;align-items:center}
    .top h1{font-size:32px}
    .hospital-title{color:#38bdf8;font-weight:600;font-size:22px;display:block;margin-bottom:2px}
    #clock{font-size:32px;font-weight:800}
    #nowCalling{border-radius:14px;padding:20px 24px;display:flex;align-items:center;gap:20px;background:#1e293b;border:3px solid #334155;min-height:110px;flex-wrap:wrap}
    #nowCalling.flash{animation:flash .8s 4}
    @keyframes flash{50%{background:#475569;border-color:#facc15}}
    #nowCalling .lvl{font-size:26px;font-weight:700;padding:4px 14px;border-radius:999px;border:1px solid #0003}
    #nowCalling .info{font-size:36px;font-weight:600}
    #nowCalling .room{font-size:42px;font-weight:800;margin-left:auto}
    #nowCalling .q{font-size:64px;font-weight:800;padding:2px 22px;border-radius:12px;border:1px solid #0003}
    .nav-link{color:#38bdf8;cursor:pointer;text-decoration:underline;font-size:16px;margin-bottom:10px;display:inline-block}
    .staff-container{background:#1e293b;padding:20px;border-radius:12px;margin-top:20px;max-width:600px}
    .staff-container input, .staff-container select{width:100%;padding:10px;margin-bottom:10px;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:6px;font-family:'Sarabun'}
    .staff-container button{padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-family:'Sarabun'}
    .staff-container button:hover{background:#1d4ed8}
  </style>
</head>
<body>

  <div id="connectionStatus">กำลังเชื่อมต่อ...</div>

  <!-- หน้าจอแสดงผลคิว (Public View) -->
  <div id="publicView" class="board">
    <div class="top">
      <div>
        <span class="hospital-title">โรงพยาบาลบางบัวทอง</span>
        <h1>ห้องฉุกเฉิน — ลำดับการรับบริการ</h1>
      </div>
      <div id="clock">--:--:--</div>
    </div>

    <a class="nav-link" onclick="switchView('staff')">[ ไปหน้าเจ้าหน้าที่ ]</a>

    <div id="nowCalling">
      <div style="font-size:28px;font-weight:600;">รอเรียกคิว...</div>
    </div>
  </div>

  <!-- หน้าจอเจ้าหน้าที่ (Staff View) -->
  <div id="staffView" class="board hidden">
    <div class="top">
      <h1>ระบบจัดการคิว (เจ้าหน้าที่)</h1>
    </div>
    <a class="nav-link" onclick="switchView('public')">[ กลับไปหน้าจอแสดงคิว ]</a>

    <div class="staff-container">
      <h3>เรียกคิวผู้ป่วย</h3>
      <input type="text" id="queueNumberInput" placeholder="ระบุเลขคิว เช่น A001">
      <select id="queueLevelInput">
        <option value="ฉุกเฉินวิกฤต (Resuscitation)">ฉุกเฉินวิกฤต (Resuscitation)</option>
        <option value="ฉุกเฉินรุนแรง (Emergency)">ฉุกเฉินรุนแรง (Emergency)</option>
        <option value="ฉุกเฉินด่วน (Urgent)">ฉุกเฉินด่วน (Urgent)</option>
        <option value="ไม่ฉุกเฉิน (Non-Urgent)">ไม่ฉุกเฉิน (Non-Urgent)</option>
      </select>
      <input type="text" id="roomInput" placeholder="ระบุห้องตรวจ เช่น ห้องฉุกเฉิน 1">
      <button onclick="callQueueSubmit()">เรียกคิวนี้</button>
      <button onclick="clearQueueSubmit()" style="background:#dc2626;margin-left:10px;">เคลียร์คิว</button>
    </div>
  </div>

  <script>
    const socket = io();
    const connStatus = document.getElementById('connectionStatus');

    socket.on('connect', () => {
      connStatus.textContent = 'เชื่อมต่อแล้ว';
      connStatus.classList.add('connected');
    });

    socket.on('disconnect', () => {
      connStatus.textContent = 'ขาดการเชื่อมต่อ';
      connStatus.classList.remove('connected');
    });

    // ฟังก์ชันสลับหน้าจอ (แก้ปัญหา switchView is not defined)
    function switchView(view) {
      const publicView = document.getElementById('publicView');
      const staffView = document.getElementById('staffView');
      if (view === 'staff') {
        publicView.classList.add('hidden');
        staffView.classList.remove('hidden');
      } else {
        staffView.classList.add('hidden');
        publicView.classList.remove('hidden');
      }
    }

    // อัปเดตนาฬิกา
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('th-TH');
    }, 1000);

    // รับข้อมูลคิวจากเซิร์ฟเวอร์
    socket.on('updateQueue', (data) => {
      const callingDiv = document.getElementById('nowCalling');
      if (data.currentCalling) {
        callingDiv.innerHTML = `
          <div class="q">${data.currentCalling.number}</div>
          <div class="lvl">${data.currentCalling.level}</div>
          <div class="room">${data.currentCalling.room}</div>
        `;
        callingDiv.classList.add('flash');
        setTimeout(() => callingDiv.classList.remove('flash'), 3200);
      } else {
        callingDiv.innerHTML = `<div style="font-size:28px;font-weight:600;">รอเรียกคิว...</div>`;
      }
    });

    // ส่งข้อมูลเมื่อเจ้าหน้าที่กดเรียกคิว
    function callQueueSubmit() {
      const number = document.getElementById('queueNumberInput').value.trim();
      const level = document.getElementById('queueLevelInput').value;
      const room = document.getElementById('roomInput').value.trim() || 'ห้องตรวจฉุกเฉิน';

      if (!number) {
        alert('กรุณากรอกเลขคิว');
        return;
      }

      socket.emit('callQueue', { number, level, room });
      document.getElementById('queueNumberInput').value = '';
    }

    // ส่งข้อมูลเมื่อเจ้าหน้าที่เคลียร์คิว
    function clearQueueSubmit() {
      socket.emit('clearQueue');
    }
  </script>
</body>
</html>
