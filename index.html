<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเรียกคิวห้องฉุกเฉิน โรงพยาบาลบางแพ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Sarabun',sans-serif;background:#0f172a;color:#e2e8f0;overflow-x:hidden}
    .hidden{display:none!important}
    #connectionStatus{position:fixed;top:10px;right:10px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;z-index:999;background:#dc2626;color:#fff}
    #connectionStatus.connected{background:#16a34a}
    #board{padding:16px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
    .top{display:flex;justify-content:space-between;align-items:center}
    .top h1{font-size:32px}
    .hospital-title{color:#38bdf8;font-weight:600;font-size:22px;display:block;margin-bottom:2px}
    #clock{font-size:32px;font-weight:800}
    #nowCalling{border-radius:14px;padding:20px 24px;display:flex;align-items:center;gap:20px;background:#1e293b;border:3px solid #334155;min-height:110px;flex-wrap:wrap}
    #nowCalling.flash{animation:flash .8s 4}
    @keyframes flash{50%{background:#475569;border-color:#facc15}}
    #nowCalling .lvl{font-size:26px;font-weight:700;padding:4px 14px;border-radius:999px;border:1px solid #0003}
    #nowCalling .info{font-size:36px;font-weight:600}
    #nowCalling .room{font-size:42px;font-weight:800;margin-left:auto}
    #nowCalling .q{font-size:64px;font-weight:800;padding:2px 22px;border-radius:12px;border:1px solid #0003}
    .lanes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex:1}
    .lane{background:#1e293b;border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:18px}
    .lane li{font-size:22px}
    .lane li.called{outline:2px solid #facc15}
    .lane li.overdue .wait{color:#f87171;font-weight:800;animation:blink 1s infinite}
    @keyframes blink{50%{opacity:.3}}
    .qb{padding:1px 8px;border-radius:6px;border:1px solid #0003}
    .wait{font-size:14px;color:#94a3b8;text-align:right}
    .status-badge{font-size:12px;padding:2px 6px;border-radius:4px;background:#334155;color:#f8fafc;margin-top:2px;display:inline-block}
    .more,.empty{font-size:14px;text-align:center;color:#64748b;padding:6px}
    #soundHint{position:absolute;right:16px;bottom:16px;background:#facc15;color:#000;padding:8px 14px;cursor:pointer;z-index:10}
    #staff{background:#f1f5f9;color:#0f172a;padding:16px;min-height:100vh}
    #staff h2{margin-bottom:12px}
    .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
    .card h3{margin-bottom:10px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    input,select,button{font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid #cbd5e1}
    button.danger{background:#dc2626;color:#fff;border:none;font-weight:600}
    button.ok{background:#16a34a}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}
    td small{color:#64748b}
    .tag{padding:2px 10px;font-weight:700;font-size:14px;border:1px solid #0003;white-space:nowrap}
    #preview{color:#64748b}
    .over{color:#dc2626;font-weight:800}
    .muted{color:#94a3b8}
    .manual{d:d97706}
  </style>
</head>
<body>
  <div id="connectionStatus">กำลังเชื่อมต่อ...</div>
  <div id="board">
    <div class="top">
      <div>
        <span class="hospital-title">โรงพยาบาลบางแพ</span>
        <h1>ห้องฉุกเฉิน — ลำดับการรับบริการ</h1>
      </div>
      <div id="clock">--:--:--</div>
    </div>
    <div id="nowCalling">
      <div>รอเรียกคิว...</div>
    </div>
    <div class="lanes" id="lanesContainer"></div>
  </div>

  <script>
    const socket = io();

    const levels = [
      { key: 'red', name: 'แดง', label: 'วิกฤต', target: 0, color: '#dc2626', text: '#fff' },
      { key: 'pink', name: 'ชมพู', label: 'ฉุกเฉินเร่งด่วน', target: 10, color: '#ec4899', text: '#fff' },
      { key: 'yellow', name: 'เหลือง', label: 'เร่งด่วน', target: 30, color: '#facc15', text: '#000' },
      { key: 'green', name: 'เขียว', label: 'ไม่รุนแรง', target: 60, color: '#16a34a', text: '#fff' },
      { key: 'white', name: 'ขาว', label: 'ทั่วไป', target: 120, color: '#f8fafc', text: '#000' }
    ];

    socket.on('connect', () => {
      document.getElementById('connectionStatus').innerText = 'เชื่อมต่อแล้ว';
      document.getElementById('connectionStatus').classList.add('connected');
    });

    socket.on('disconnect', () => {
      document.getElementById('connectionStatus').innerText = 'ขาดการเชื่อมต่อ';
      document.getElementById('connectionStatus').classList.remove('connected');
    });

    socket.on('init-state', (data) => {
      updateBoard(data);
    });

    socket.on('sync-state', (data) => {
      updateBoard(data);
    });

    function updateBoard(data) {
      // ฟังก์ชันอัปเดตหน้าจอตามข้อมูลที่ได้รับจาก Server
    }

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
    }, 1000);
  </script>
</body>
</html>
